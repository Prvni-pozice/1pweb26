<!doctype html><meta charset="utf-8">
<style>
 @font-face{font-family:R;font-weight:400;src:url("../../src/styles/fonts/roboto-400.woff2")}
 @font-face{font-family:R;font-weight:700;src:url("../../src/styles/fonts/roboto-700.woff2")}
 @font-face{font-family:R;font-weight:900;src:url("../../src/styles/fonts/roboto-900.woff2")}
 @font-face{font-family:M;font-weight:500;src:url("../../src/styles/fonts/roboto-mono-500.woff2")}
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:800px;height:600px;overflow:hidden}
 body{background:#1D1F1E;font-family:R,Arial,sans-serif;color:#fff;position:relative;padding:36px 48px}
 .glow{position:absolute;right:-160px;top:-200px;width:620px;height:620px;border-radius:50%;
   background:radial-gradient(circle,rgba(152,200,0,.34) 0%,rgba(152,200,0,.08) 45%,rgba(152,200,0,0) 70%)}
 .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:40px 40px;
   -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.4) 70%,transparent 100%)}
 .in{position:relative}
 .badge{display:inline-flex;align-items:center;gap:10px;background:#98C800;color:#1D1F1E;font-family:M;font-weight:500;font-size:15px;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border-radius:999px}
 .badge i{width:8px;height:8px;border-radius:50%;background:#1D1F1E;display:block}
 h1{margin-top:24px;font-weight:900;font-size:64px;line-height:1.02;letter-spacing:-.025em}
 h1 span{color:#98C800}
 .tiles{margin-top:26px;display:flex;gap:9px}
 .t{width:60px;height:60px;border-radius:12px;background:#98C800;color:#1D1F1E;font-family:M;font-weight:500;font-size:19px;display:flex;align-items:flex-end;justify-content:flex-start;padding:7px 9px;position:relative}
 .t:nth-child(odd){background:#b4dc2e}
 .t.last{background:#fff}
 .t.last:after{content:"✓";position:absolute;right:8px;top:4px;font-family:R;font-weight:900;font-size:18px;color:#98C800}
 .meta{margin-top:18px;font-family:M;font-weight:500;font-size:14px;letter-spacing:.06em;color:rgba(255,255,255,.55);text-transform:uppercase}
</style>
<div class="glow"></div><div class="grid"></div>
<div class="in">
 <div class="badge"><i></i>Seriál · 10 dílů · kompletní</div>
 <div class="tiles">
  <div class="t">01</div><div class="t">02</div><div class="t">03</div><div class="t">04</div><div class="t">05</div>
  <div class="t">06</div><div class="t">07</div><div class="t">08</div><div class="t">09</div><div class="t last">10</div>
 </div>
 <h1>Lokální AI<br><span>bez grafické karty</span></h1>
 </div>
